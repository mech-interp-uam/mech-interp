name: deploy-book

on:
  push:
    branches:
      - master
    # Only run when changes occur in the book/ folder
    paths:
      - "book/**"
  pull_request:
    branches:
      - master
    # Only run on pull requests if files in the book/ folder were changed
    paths:
      - "book/**"

jobs:
  deploy-book:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'master' &&
       (github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r book/requirements.txt
          pip install jupyter-book   # ✅ añadido: asegura que jupyter-book esté disponible aunque no esté en requirements.txt

      - name: cache executed notebooks
        uses: actions/cache@v4
        with:
          path: book/_build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('book/requirements.txt') }}

      - name: Build the book
        run: |
          set -e                                  # ✅ añadido: detiene el flujo si hay un error
          cd book                                 # ✅ añadido: entra al directorio donde está el libro
          jupyter-book build . --all --verbose    # ✅ añadido: modo detallado para ver posibles errores de compilación
          echo "Listing build output:"            # ✅ añadido: muestra el contenido de la carpeta _build
          ls -la _build || true                   # ✅ añadido: lista archivos generados para verificar el build
          ls -la _build/html || true              # ✅ añadido: confirma que exista la carpeta HTML
          cd ..                                   # ✅ añadido: vuelve a la raíz antes de subir artefactos

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/_build/html   # ✅ modificado: ruta explícita y correcta del build HTML

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
